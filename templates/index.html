<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ bot_name }} — AIChatBot</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --border: #2a2f3d;
      --text: #e6e8ee; --muted: #9aa2b1;
      --user: #2563eb; --bot: #242938; --accent: #6ea8fe;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef1f6; --panel: #ffffff; --border: #e0e4ec;
        --text: #1a1d24; --muted: #5c6370;
        --user: #2563eb; --bot: #f0f2f7; --accent: #2563eb;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .chat {
      width: 100%; max-width: 640px; height: min(88vh, 760px);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent); color: #fff; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .header-info { flex: 1; min-width: 0; }
    header h1 { font-size: 1.05rem; margin: 0; }
    header p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
    /* Backend switcher */
    #backendSelect {
      padding: 6px 26px 6px 10px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
      font-size: 0.82rem; cursor: pointer; outline: none;
    }
    #backendSelect:focus { border-color: var(--accent); }
    #backendSelect:disabled { opacity: 0.5; cursor: progress; }
    /* Centered "system" note (e.g. backend switched) */
    .sys-note {
      align-self: center; text-align: center; max-width: 90%;
      font-size: 0.78rem; color: var(--muted);
      padding: 2px 10px;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex;
      flex-direction: column; gap: 12px;
    }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot  { align-self: flex-start; background: var(--bot); color: var(--text); border-bottom-left-radius: 4px; }
    /* Three-dot "typing…" loader, like common chat apps */
    .typing { padding-top: 14px; padding-bottom: 14px; }
    .typing-dots { display: inline-flex; align-items: center; gap: 5px; }
    .typing-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); opacity: 0.45;
      animation: typing-bounce 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
    #input {
      flex: 1; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 1rem; outline: none;
    }
    #input:focus { border-color: var(--accent); }
    button {
      padding: 0 18px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
      font-size: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <div class="avatar" id="avatar">{{ bot_name[0] }}</div>
      <div class="header-info">
        <h1 id="botName">{{ bot_name }}</h1>
        <p id="statusLabel">{{ status_label }}</p>
      </div>
      <select id="backendSelect" title="Switch backend">
        {% for b in backends %}
        <option value="{{ b.key }}" {% if b.key == current_backend %}selected{% endif %}>{{ b.label }}</option>
        {% endfor %}
      </select>
    </header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message…" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const backendSelect = document.getElementById("backendSelect");
    const botNameEl = document.getElementById("botName");
    const statusLabelEl = document.getElementById("statusLabel");
    const avatarEl = document.getElementById("avatar");
    const BOT_NAME = {{ bot_name | tojson }};
    let currentBackend = backendSelect.value;

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // Centered informational line (backend switched, errors, etc.)
    function addSystemNote(text) {
      const div = document.createElement("div");
      div.className = "sys-note";
      div.textContent = "— " + text + " —";
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // Animated three-dot "bot is typing" bubble
    function addTypingIndicator() {
      const div = document.createElement("div");
      div.className = "msg bot typing";
      div.innerHTML =
        '<span class="typing-dots"><span></span><span></span><span></span></span>';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const MIN_TYPING_MS = 600; // keep the loader visible long enough to read

    // Greeting on load
    addMessage(`Hi! I'm ${BOT_NAME}. Ask me anything, or type "help".`, "bot");

    // Switch backend live from the dropdown
    backendSelect.addEventListener("change", async () => {
      const chosen = backendSelect.value;
      backendSelect.disabled = true;
      try {
        const res = await fetch("/switch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ backend: chosen })
        });
        const data = await res.json();
        if (data.ok) {
          botNameEl.textContent = data.bot_name;
          statusLabelEl.textContent = data.status_label;
          avatarEl.textContent = (data.bot_name || "?").charAt(0);
          currentBackend = chosen;
          addSystemNote(data.status_label);
        } else {
          addSystemNote("Couldn't switch: " + (data.error || "unknown error"));
          backendSelect.value = currentBackend;   // revert the dropdown
        }
      } catch (err) {
        addSystemNote("Couldn't switch (network error).");
        backendSelect.value = currentBackend;
      } finally {
        backendSelect.disabled = false;
        input.focus();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;

      const typing = addTypingIndicator();
      const minVisible = wait(MIN_TYPING_MS);

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        await minVisible;           // let the loader show for at least MIN_TYPING_MS
        typing.remove();
        addMessage(data.reply, "bot");
      } catch (err) {
        await minVisible;
        typing.remove();
        addMessage("Network error — is the server running?", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
